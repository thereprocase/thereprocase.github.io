<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Render</title>
<style>*{box-sizing:border-box}html,body{margin:0;height:100%;background:#f3efe6;overflow:hidden;font-family:system-ui,sans-serif}canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}header{position:absolute;top:32px;left:44px;right:44px;pointer-events:none;color:#243c43}h1{font:700 38px system-ui;margin:0 0 7px;letter-spacing:-1px}p{font:17px system-ui;margin:0;color:#536a6d}footer{position:absolute;bottom:28px;left:44px;right:44px;color:#536a6d;font:16px system-ui;pointer-events:none}#load{position:absolute;top:45%;width:100%;text-align:center} @media(max-width:600px){header{top:14px;left:16px;right:16px}h1{font-size:22px}p{font-size:12px}footer{left:16px;right:16px;bottom:12px;font-size:12px}} </style>
<canvas id="c"></canvas><header><h1 id="title"></h1><p id="subtitle"></p></header><footer id="caption"></footer><div id="load">Loading</div><script>
"use strict";const cv=document.getElementById("c"),$=id=>document.getElementById(id);const gl=cv.getContext("webgl2",{antialias:true,preserveDrawingBuffer:true});if(!gl)throw Error("WebGL2 unavailable");
function program(vs, fs) {
  const p = gl.createProgram();
  for (const [type, src] of [[gl.VERTEX_SHADER, vs], [gl.FRAGMENT_SHADER, fs]]) {
    const s = gl.createShader(type);
    gl.shaderSource(s, "#version 300 es\nprecision highp float;\n" + src);
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
    gl.attachShader(p, s);
  }
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  return p;
}

// Cel surface: flat facet normals from screen derivatives, three light bands.
const celProg = program(`
in vec3 pos; in float dev;
uniform mat4 mvp; uniform mat4 view;
out vec3 vView; out float vDev;
void main(){ vec4 p = view*vec4(pos,1.0); vView = p.xyz; vDev = dev; gl_Position = mvp*vec4(pos,1.0); }`,
`in vec3 vView; in float vDev;
uniform vec3 base; uniform int useDev; uniform float alpha;
out vec4 o;
vec3 devColor(float d){
  if (d <= 0.05) return vec3(0.373,0.749,0.416);
  if (d <= 0.5)  return vec3(0.788,0.843,0.353);
  if (d <= 2.0)  return vec3(0.941,0.714,0.282);
  return vec3(0.910,0.408,0.290);
}
void main(){
  vec3 n = normalize(cross(dFdx(vView), dFdy(vView)));
  vec3 l = normalize(vec3(-0.45, 0.75, 0.5));
  float d = max(dot(n, l), 0.0);
  float band = d > 0.6 ? 1.0 : d > 0.25 ? 0.86 : 0.72;
  float rim = 1.0 - abs(n.z);
  vec3 c = (useDev == 1 ? devColor(vDev) : base) * band;
  if (rim > 0.82) c *= 0.85;
  o = vec4(c, alpha);
}`);

// Inverted hull: back faces pushed out along smooth normals give the silhouette ink.
const hullProg = program(`
in vec3 pos; in vec3 nrm;
uniform mat4 mvp; uniform float push;
void main(){ gl_Position = mvp*vec4(pos + nrm*push, 1.0); }`,
`uniform vec3 ink; out vec4 o; void main(){ o = vec4(ink,1.0); }`);

const lineProg = program(`
in vec3 pos; uniform mat4 mvp;
void main(){ vec4 p = mvp*vec4(pos,1.0); p.z -= 0.0004*p.w; gl_Position = p; }`,
`uniform vec4 col; out vec4 o; void main(){ o = col; }`);

// ---- meshes --------------------------------------------------------------
function upload(buf, info) {
  const nv = info.vertices, nt = info.triangles, ne = info.edges;
  let off = 0;
  const pos = new Float32Array(buf, off, nv * 3); off += nv * 12;
  const idx = new Uint32Array(buf, off, nt * 3); off += nt * 12;
  const nrm = new Float32Array(buf, off, nv * 3); off += nv * 12;
  const edg = new Uint32Array(buf, off, ne * 2); off += ne * 8;
  const dev = info.deviation ? new Float32Array(buf, off, nv) : new Float32Array(nv);
  const vbo = (data, target = gl.ARRAY_BUFFER) => { const b = gl.createBuffer(); gl.bindBuffer(target, b); gl.bufferData(target, data, gl.STATIC_DRAW); return b; };
  const m = {info, pos, nTri: nt * 3, nEdge: ne * 2,
    bPos: vbo(pos), bNrm: vbo(nrm), bDev: vbo(dev),
    bIdx: vbo(idx, gl.ELEMENT_ARRAY_BUFFER), bEdg: vbo(edg, gl.ELEMENT_ARRAY_BUFFER)};
  let lo = [1e9, 1e9, 1e9], hi = [-1e9, -1e9, -1e9];
  for (let i = 0; i < pos.length; i += 3) for (let k = 0; k < 3; k++) { lo[k] = Math.min(lo[k], pos[i + k]); hi[k] = Math.max(hi[k], pos[i + k]); }
  m.lo = lo; m.hi = hi;
  return m;
}

function bind(prog, m, withIdx) {
  gl.useProgram(prog);
  const attr = (name, buf, size) => {
    const loc = gl.getAttribLocation(prog, name);
    if (loc < 0) return;
    gl.bindBuffer(gl.ARRAY_BUFFER, buf); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, size, gl.FLOAT, false, 0, 0);
  };
  for (let i = 0; i < 4; i++) gl.disableVertexAttribArray(i);
  attr("pos", m.bPos, 3); attr("nrm", m.bNrm, 3); attr("dev", m.bDev, 1);
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, withIdx === "edges" ? m.bEdg : m.bIdx);
}
const U = (p, n) => gl.getUniformLocation(p, n);

// ---- camera (body frame: -Y is up) ---------------------------------------
const cam = {yaw: -0.7, pitch: 0.45, dist: 450, target: [0, 0, 0]};
function mat4mul(a, b) { const o = new Float32Array(16); for (let c = 0; c < 4; c++) for (let r = 0; r < 4; r++) { let s = 0; for (let k = 0; k < 4; k++) s += a[k * 4 + r] * b[c * 4 + k]; o[c * 4 + r] = s; } return o; }
function lookAt(eye, at, up) {
  const sub = (a, b) => a.map((x, i) => x - b[i]), norm = a => { const l = Math.hypot(...a); return a.map(x => x / l); };
  const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
  const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
  const z = norm(sub(eye, at)), x = norm(cross(up, z)), y = cross(z, x);
  return new Float32Array([x[0], y[0], z[0], 0, x[1], y[1], z[1], 0, x[2], y[2], z[2], 0, -dot(x, eye), -dot(y, eye), -dot(z, eye), 1]);
}
function persp(fov, asp, n, f) { const t = 1 / Math.tan(fov / 2); return new Float32Array([t / asp, 0, 0, 0, 0, t, 0, 0, 0, 0, (f + n) / (n - f), -1, 0, 0, 2 * f * n / (n - f), 0]); }
function eyeBasis() {
  const cp = Math.cos(cam.pitch), sp = Math.sin(cam.pitch);
  // Horizontal plane is X/Z; up is -Y.
  const dir = [cp * Math.cos(cam.yaw), -sp, cp * Math.sin(cam.yaw)];
  return dir;
}


let models=[],scene={};window.renderReady=false;
function home(){
 if(!models.length)return;let lo=[Infinity,Infinity,Infinity],hi=[-Infinity,-Infinity,-Infinity];
 for(const m of models)for(let k=0;k<3;k++){lo[k]=Math.min(lo[k],m.lo[k]);hi[k]=Math.max(hi[k],m.hi[k]);}
 cam.target=scene.camera?.target||lo.map((l,i)=>(l+hi[i])/2);
 const r=Math.hypot(...hi.map((h,i)=>h-lo[i]))/2,asp=cv.clientWidth/cv.clientHeight;
 cam.dist=scene.camera?.distance||(asp<1?1.25:1)*r/Math.sin(Math.atan(Math.tan(.3)*Math.min(1,asp)));
 if(!scene.camera?.distance)for(let attempt=0;attempt<16;attempt++){
  const d=eyeBasis(),eye=cam.target.map((t,i)=>t+d[i]*cam.dist),matrix=mat4mul(persp(.6,asp,cam.dist*.02,cam.dist*6),lookAt(eye,cam.target,[0,-1,0]));let extent=0;
  for(const x of [lo[0],hi[0]])for(const y of [lo[1],hi[1]])for(const z of [lo[2],hi[2]]){
   const q=[0,1,2,3].map(i=>matrix[i]*x+matrix[i+4]*y+matrix[i+8]*z+matrix[i+12]);extent=Math.max(extent,Math.abs(q[0]/q[3])/.9,Math.abs(q[1]/q[3])/.68);
  }
  if(extent<=1)break;cam.dist*=Math.max(1.05,extent*1.03);
 }
}
function draw(){
 const dpr=Math.min(devicePixelRatio,2),w=Math.round(cv.clientWidth*dpr),h=Math.round(cv.clientHeight*dpr);if(cv.width!==w||cv.height!==h){cv.width=w;cv.height=h;}
 gl.viewport(0,0,w,h);gl.clearColor(.953,.937,.902,1);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
 const d=eyeBasis(),eye=cam.target.map((t,i)=>t+d[i]*cam.dist),view=lookAt(eye,cam.target,[0,-1,0]),proj=persp(.6,w/h,cam.dist*.02,cam.dist*6),mvp=mat4mul(proj,view);
 gl.enable(gl.DEPTH_TEST);gl.depthFunc(gl.LEQUAL);
 for(const m of models){
  gl.enable(gl.CULL_FACE);gl.cullFace(gl.FRONT);bind(hullProg,m);gl.uniformMatrix4fv(U(hullProg,"mvp"),false,mvp);gl.uniform1f(U(hullProg,"push"),cam.dist*.0022);gl.uniform3f(U(hullProg,"ink"),.114,.106,.094);gl.drawElements(gl.TRIANGLES,m.nTri,gl.UNSIGNED_INT,0);
  gl.disable(gl.CULL_FACE);bind(celProg,m);gl.uniformMatrix4fv(U(celProg,"mvp"),false,mvp);gl.uniformMatrix4fv(U(celProg,"view"),false,view);gl.uniform3fv(U(celProg,"base"),m.info.color||[.36,.64,.69]);gl.uniform1i(U(celProg,"useDev"),0);gl.uniform1f(U(celProg,"alpha"),1);gl.drawElements(gl.TRIANGLES,m.nTri,gl.UNSIGNED_INT,0);
  bind(lineProg,m,"edges");gl.uniformMatrix4fv(U(lineProg,"mvp"),false,mvp);gl.uniform4fv(U(lineProg,"col"),[.114,.106,.094,1]);gl.drawElements(gl.LINES,m.nEdge,gl.UNSIGNED_INT,0);
 }
 if(models.length)window.renderReady=true;requestAnimationFrame(draw);
}
async function start(){
 const r=await fetch("scene.json");if(!r.ok)throw Error("Scene unavailable");scene=await r.json();
 for(const k of ["title","subtitle","caption"])$(k).textContent=scene[k]||"";
 cam.yaw=scene.camera?.yaw??-1.05;cam.pitch=scene.camera?.pitch??.87;
 models=await Promise.all(scene.parts.map(async info=>{const r=await fetch(info.file);if(!r.ok)throw Error(info.file+": "+r.status);return upload(await r.arrayBuffer(),info);}));
 home();cam.dist*=scene.camera?.zoom??.8;$("load").style.display="none";draw();
}

start().catch(e=>{$("load").textContent="Render failed: "+e.message;console.error(e);});

const pointers=new Map(); let gesture=null;
function snapshot(){const p=[...pointers.values()];return p.length===2?{x:(p[0].x+p[1].x)/2,y:(p[0].y+p[1].y)/2,d:Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y),pan:true}:p.length?{...p[0],d:0}:null;}
function pan(dx,dy){const d=eyeBasis(),right=[-Math.sin(cam.yaw),0,Math.cos(cam.yaw)],up=[-Math.sin(cam.pitch)*Math.cos(cam.yaw),-Math.cos(cam.pitch),-Math.sin(cam.pitch)*Math.sin(cam.yaw)],s=2*cam.dist*Math.tan(.3)/cv.clientHeight;for(let k=0;k<3;k++)cam.target[k]+=(-dx*right[k]+dy*up[k])*s;}
cv.addEventListener('contextmenu',e=>e.preventDefault());
cv.addEventListener('pointerdown',e=>{pointers.set(e.pointerId,{x:e.clientX,y:e.clientY,pan:e.button===2||e.button===1});cv.setPointerCapture(e.pointerId);gesture=snapshot();});
cv.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;const old=pointers.get(e.pointerId);pointers.set(e.pointerId,{...old,x:e.clientX,y:e.clientY});const g=snapshot();if(gesture&&g){if(g.pan){pan(g.x-gesture.x,g.y-gesture.y);if(g.d&&gesture.d)cam.dist*=gesture.d/g.d;}else{cam.yaw-=(g.x-gesture.x)*.006;cam.pitch=Math.max(-1.45,Math.min(1.45,cam.pitch+(g.y-gesture.y)*.006));}}gesture=g;});
for(const event of ['pointerup','pointercancel'])cv.addEventListener(event,e=>{pointers.delete(e.pointerId);gesture=snapshot();});
cv.addEventListener('wheel',e=>{e.preventDefault();cam.dist*=Math.exp(e.deltaY*.001);},{passive:false});
cv.addEventListener('dblclick',()=>{cam.yaw=scene.camera?.yaw??-1.05;cam.pitch=scene.camera?.pitch??.87;home();cam.dist*=scene.camera?.zoom??.8;});

</script></html>
